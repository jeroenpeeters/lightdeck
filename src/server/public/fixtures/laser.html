<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1114" />
    <title>Laser</title>
    <link rel="preload" href="/fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures/laser.css" />
  </head>
  <body>
    <!-- The shell puts the status bar, the tempo and the notice above this. -->
    <main class="console" id="console">
      <header class="fixture-head">
        <h1 id="fixture-name">Laser</h1>
        <p class="where" id="where"></p>
      </header>

      <section class="panel output" aria-labelledby="output-title">
        <h2 id="output-title">Output</h2>
        <div class="laser-tile" id="laser-tile" data-on="false">
          <span class="laser-state" id="laser-state"></span>
          <span class="laser-detail" id="laser-detail"></span>
        </div>
      </section>

      <div class="panel work">
        <p class="hint" id="laser-hint" hidden></p>
        <div class="laser-blocks" id="laser-blocks"></div>

        <h3>Channels being sent</h3>
        <ol class="readout" id="readout"></ol>
      </div>
    </main>

    <script type="module" src="/fixtures/laser.js"></script>
  </body>
</html>
