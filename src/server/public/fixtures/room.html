<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <title>Room Lights</title>
    <link rel="preload" href="/fonts/plex-condensed-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/plex.css" />
    <link rel="stylesheet" href="/lightdeck.css" />
    <link rel="stylesheet" href="/chrome.css" />
    <link rel="stylesheet" href="/fixtures/room.css" />
  </head>
  <body>
    <!-- The shell puts the top bar (a Live key, the tempo, the masters, Blackout) first in .app. -->
    <div class="app page" id="app">
      <header class="page-head">
        <div class="ph-title">
          <h1 id="fixture-name">Room Lights</h1>
          <span class="meta" id="where"></span>
          <span class="tag mute" id="running" data-on="false"></span>
        </div>
        <div class="ph-actions" id="whole-room"></div>
      </header>

      <div class="setup no-nav">
        <main class="setup-main" aria-label="Lamps">
          <section class="panel room-dimmer" aria-label="Room dimmer">
            <div id="dimmer-sliders"></div>
            <p class="hint" id="dimmer-hint"></p>
          </section>
          <div class="zones" id="zones"></div>
        </main>

        <aside class="setup-side" aria-label="Scenery">
          <p class="hint scenery-intro">
            The lamps are the slow light under the spider and the laser. A palette colours them, and
            an effect moves its colours over the lamps now and then.
          </p>

          <section class="block" aria-labelledby="palette-title">
            <div class="sh"><h3 id="palette-title">Palette</h3></div>
            <div class="chips" id="palette-list"></div>
            <p class="hint" id="palette-hint"></p>
            <div class="sh"><h3>Palette pace</h3></div>
            <fieldset class="row pace" id="palette-speed">
              <legend class="visually-hidden">Palette pace</legend>
            </fieldset>
            <p class="hint" id="pace-hint"></p>
          </section>

          <section class="block" aria-labelledby="effect-title">
            <div class="sh"><h3 id="effect-title">Scenery effect</h3></div>
            <div class="chips" id="effect-list"></div>
            <p class="hint" id="effect-hint"></p>
            <div class="sh"><h3>Speed of this effect</h3></div>
            <fieldset id="effect-speed">
              <legend class="visually-hidden">Speed of this effect</legend>
            </fieldset>
            <p class="hint" id="speed-hint"></p>
          </section>

          <section class="block" aria-labelledby="fade-title">
            <div class="sh"><h3 id="fade-title">Fade</h3></div>
            <div id="fade-sliders"></div>
            <p class="hint" id="fade-hint"></p>
          </section>
        </aside>
      </div>

      <div class="notices-stack" id="notices"></div>
    </div>

    <script type="module" src="/fixtures/room.js"></script>
  </body>
</html>
