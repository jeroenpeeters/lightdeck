<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1114" />
    <title>Room Lights</title>
    <link rel="preload" href="/fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fixtures/room.css" />
  </head>
  <body>
    <!-- The shell puts the status bar, the tempo and the notice above this. -->
    <main class="console" id="console">
      <header class="fixture-head">
        <h1 id="fixture-name">Room Lights</h1>
        <p class="where" id="where"></p>
        <p class="running" id="running" data-on="false"></p>
      </header>

      <section class="panel lamps" aria-labelledby="lamps-title">
        <div class="lamps-head">
          <h2 id="lamps-title">Lamps</h2>
          <div class="whole-room" id="whole-room"></div>
        </div>
        <div class="sliders room-dimmer" id="dimmer-sliders"></div>
        <p class="hint" id="dimmer-hint"></p>
        <div id="zones"></div>
      </section>

      <div class="panel scenery">
        <h2>Scenery</h2>
        <p class="hint">
          The lamps are the slow light under the spider and the laser. A palette colours them, and
          an effect moves its colours over the lamps now and then.
        </p>

        <fieldset class="choice palette-list" id="palette-list">
          <legend>Palette</legend>
        </fieldset>
        <fieldset class="choice" id="palette-speed">
          <legend>Palette pace</legend>
        </fieldset>
        <p class="hint" id="pace-hint"></p>
        <p class="hint" id="palette-hint"></p>

        <fieldset class="effect-list" id="effect-list">
          <legend class="visually-hidden">Choose an effect</legend>
        </fieldset>
        <button type="button" class="key stop" id="effect-stop">No effect</button>
        <p class="hint" id="effect-hint"></p>
        <fieldset class="choice" id="effect-speed">
          <legend>Speed of this effect</legend>
        </fieldset>
        <p class="hint" id="speed-hint"></p>

        <div class="sliders" id="fade-sliders"></div>
        <p class="hint" id="fade-hint"></p>
      </div>
    </main>

    <script type="module" src="/fixtures/room.js"></script>
  </body>
</html>
