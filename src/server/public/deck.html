<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <title>Deck</title>
    <link rel="preload" href="/fonts/plex-condensed-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/plex.css" />
    <link rel="stylesheet" href="/lightdeck.css" />
    <link rel="stylesheet" href="/chrome.css" />
    <link rel="stylesheet" href="/deck.css" />
  </head>
  <body>
    <!--
      The shell puts the top bar (Live, the tempo, the masters, Blackout) first in .app and its notice in
      #notices. Everything else is built by deck.js from the show: the nav (groups, lanes), the grid of keys and
      the side panel (the sequences in Show; storing, the picked key and the groups in Program).
    -->
    <div class="app page" id="app">
      <!-- Always there, so that nothing moves when Program starts: striped blue in Program. -->
      <div class="prog-bar" id="prog" aria-hidden="true"></div>

      <header class="page-head">
        <div class="ph-title">
          <h1>Deck</h1>
          <span class="tag edit" id="program-tag" hidden>Program</span>
          <span class="meta" id="where"></span>
        </div>
        <div class="ph-actions" id="mode"></div>
      </header>

      <div class="setup">
        <nav class="setup-nav" aria-label="Groups and lanes">
          <div class="snav short" id="nav"></div>
        </nav>

        <main class="setup-main" id="main">
          <div class="d-bar">
            <span class="lbl" id="d-where"></span>
            <div class="d-pager" id="d-pager">
              <button type="button" class="key c" id="d-prev" aria-label="Previous page">&lsaquo;</button>
              <button type="button" class="key c" id="d-next" aria-label="Next page">&rsaquo;</button>
            </div>
          </div>
          <p class="hint" id="d-none" hidden></p>
          <div class="d-grid" id="d-grid"></div>
          <button type="button" class="key c d-off" id="d-off">Off</button>
        </main>

        <aside class="setup-side" id="side" aria-label="Sequences and storing">
          <!-- Program: storing what is on now, the key that is picked, the group, a new group. -->
          <div class="d-program" id="d-program" hidden>
            <section class="d-sec" aria-labelledby="store-title">
              <div class="sh"><h3 id="store-title">Store what is on now</h3></div>
              <fieldset class="keys d-types" id="store-types" aria-label="What to store"></fieldset>
              <div class="panel d-keeps" id="store-keeps"></div>
              <form class="d-form" id="store-form">
                <label class="fld"><span class="lbl">Name</span><input class="field" id="item-name" type="text" maxlength="40" autocomplete="off" /></label>
                <div class="d-pair">
                  <button type="submit" class="key c d-edit" id="store-new">Store as new</button>
                  <button type="button" class="key c d-edit" id="store-replace">Replace picked</button>
                </div>
                <button type="button" class="key c d-edit" id="store-changes"></button>
              </form>
            </section>

            <section class="d-sec" aria-labelledby="picked-title">
              <div class="sh"><h3 id="picked-title">Nothing picked</h3></div>
              <div class="d-pair">
                <button type="button" class="key c" id="item-rename">Rename</button>
                <button type="button" class="key c d-delete" id="item-delete">Delete…</button>
              </div>
              <p class="hint d-sure" id="item-sure"></p>
            </section>

            <section class="d-sec" aria-labelledby="group-title">
              <div class="sh"><h3 id="group-title">Group</h3></div>
              <form class="d-form" id="group-form">
                <label class="fld"><span class="lbl">Name of the group</span><input class="field" id="group-rename" type="text" maxlength="40" autocomplete="off" /></label>
                <div class="d-pair">
                  <button type="submit" class="key c" id="group-rename-key">Rename</button>
                  <button type="button" class="key c d-delete" id="group-delete">Delete group</button>
                </div>
                <p class="hint d-sure" id="group-sure"></p>
              </form>
            </section>

            <section class="d-sec" aria-labelledby="new-group-title">
              <div class="sh"><h3 id="new-group-title">New group</h3></div>
              <form class="d-form" id="make-group">
                <label class="fld"><span class="lbl">Name of the new group</span><input class="field" id="group-name" type="text" maxlength="40" autocomplete="off" /></label>
                <fieldset class="d-ticks" id="group-fixtures"><legend class="lbl">Its fixtures</legend></fieldset>
                <button type="submit" class="key c d-edit">Make group</button>
              </form>
            </section>
          </div>

          <!-- The sequences of the show: which one, Start/Stop and Next, where it is, its steps. -->
          <section class="d-sec d-seq" id="sequences" aria-labelledby="sequence-title">
            <div class="sh"><h3 id="sequence-title">Sequence</h3><span class="t2 d-seq-state" id="sequence-state"></span></div>
            <div class="tabs d-seq-tabs" id="sequence-tabs"></div>
            <div class="d-pair">
              <button type="button" class="key c" id="sequence-toggle">Start</button>
              <button type="button" class="key c" id="sequence-next">Next</button>
            </div>
            <p class="d-status" id="sequence-status"></p>
            <ol class="d-steps" id="sequence-steps"></ol>
            <p class="hint" id="sequence-none" hidden>This show has no sequences. They are written in the show file.</p>
          </section>
        </aside>
      </div>

      <!-- Last: a notice lies over the foot of the screen and moves no key. The shell puts its own in here too. -->
      <div class="notices-stack" id="notices">
        <p class="notice" id="deck-notice" data-level="alarm" role="alert" hidden></p>
      </div>
    </div>

    <script type="module" src="/deck.js"></script>
  </body>
</html>
