<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1114" />
    <title>Deck</title>
    <link rel="preload" href="/fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/deck.css" />
  </head>
  <body>
    <!-- The shell puts the status bar and the tempo above this. Its notice goes below. -->
    <main class="console" id="console">
      <header class="fixture-head deck-head">
        <h1>Deck</h1>
        <p class="where" id="where"></p>
        <button type="button" class="pick mode" id="mode" aria-pressed="false">Program</button>
      </header>

      <p class="hint deck-hint" id="deck-hint" hidden></p>

      <!-- The fader of the master comes here. It is there in Show and in Program. -->
      <section class="panel grand-master" id="grand-master" aria-label="Master"></section>

      <!-- A row per group comes here. -->
      <div class="groups" id="groups" hidden></div>

      <section class="panel" id="new-group" aria-labelledby="new-group-title" hidden>
        <h2 id="new-group-title">New group</h2>
        <form class="new-group" id="make-group">
          <div class="name-row">
            <label for="group-name">Name of the new group</label>
            <input class="field" id="group-name" type="text" maxlength="40" autocomplete="off" />
          </div>
          <fieldset class="ticks" id="group-fixtures">
            <legend>Its fixtures</legend>
          </fieldset>
          <button type="submit" class="key">Make group</button>
        </form>
      </section>

      <!--
        Last, and kept at the bottom of the screen: a notice moves no key when it comes.
        The deck puts the notice of the shell here too.
      -->
      <div class="notices">
        <div class="notices-stack" id="notices">
          <p class="notice" id="deck-notice" data-level="alarm" role="alert" hidden></p>
        </div>
      </div>
    </main>

    <script type="module" src="/deck.js"></script>
  </body>
</html>
