<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1114" />
    <title>Deck</title>
    <link rel="preload" href="/fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/deck.css" />
  </head>
  <body>
    <!-- The shell puts the status bar, the tempo and the notice above this. -->
    <main class="console" id="console">
      <header class="fixture-head">
        <h1>Deck</h1>
        <p class="where" id="where"></p>
        <p class="running" id="running" data-on="false"></p>
      </header>

      <p class="notice" id="deck-notice" data-level="alarm" role="alert" hidden></p>

      <section class="panel" aria-labelledby="scenes-title">
        <div class="panel-head">
          <h2 id="scenes-title">Scenes</h2>
          <button type="button" class="pick" id="edit" aria-pressed="false">Edit scenes</button>
        </div>
        <p class="hint" id="scenes-hint" hidden></p>
        <div class="scene-grid" id="scenes"></div>
      </section>

      <section class="panel" id="edit-panel" aria-labelledby="edit-title" hidden>
        <h2 id="edit-title">Edit scene</h2>
        <form class="name-row" id="rename">
          <label for="edit-name">Name</label>
          <input class="field" id="edit-name" type="text" maxlength="40" autocomplete="off" />
          <button type="submit" class="key" id="rename-key">Rename</button>
        </form>
        <button type="button" class="key delete" id="delete">Delete</button>
      </section>

      <section class="panel" aria-labelledby="store-title">
        <h2 id="store-title">Store</h2>
        <p class="hint">
          Set the fixtures on their pages, then store what they do as a scene. A fixture that is
          dark stays dark in the scene.
        </p>
        <form class="name-row" id="store-new">
          <label for="new-name">Name of the new scene</label>
          <input class="field" id="new-name" type="text" maxlength="40" autocomplete="off" />
          <button type="submit" class="key" id="store-key">Store as new scene</button>
        </form>
        <button type="button" class="key store-over" id="store-over" hidden></button>
      </section>
    </main>

    <script type="module" src="/deck.js"></script>
  </body>
</html>
