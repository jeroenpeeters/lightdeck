<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lightdeck" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Tablet · Lightdeck</title>
    <link rel="preload" href="/fonts/plex-condensed-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The design of the console (design/): the fonts, the tokens and keys, and the layout of this page. -->
    <link rel="stylesheet" href="/plex.css" />
    <link rel="stylesheet" href="/lightdeck.css" />
    <link rel="stylesheet" href="/tablet.css" />
    <!-- The settings of the video wall, which /videowall has too. -->
    <link rel="stylesheet" href="/videowall.css" />
  </head>
  <body>
    <!--
      The page for a tablet, as the design of the console has it (design/mockups/01 and 02): a top bar
      that is always there, a rail of the groups with what each shows right now, the looks of a mood
      with a strip of what every lane does, a tray to vary the look with, and at the foot the parts of
      the evening. The ids that start with t- are those of tabletParts.js, which draws the tempo, the
      masters, the links and the lamps of the room, and tabletRail.js draws the rail.
    -->
    <div class="app tablet" id="console">
      <header class="top t-top">
        <!-- A small menu with the keys that are seldom needed. Its key has a dot for each link. -->
        <div class="t-menu-wrap">
          <button
            type="button"
            class="menu"
            id="t-menu-key"
            aria-expanded="false"
            aria-controls="t-menu"
            aria-label="Menu"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" /></svg>
            <span class="dots" aria-hidden="true">
              <i id="t-dot-bridge"></i><i id="t-dot-device"></i><i id="t-dot-hass" hidden></i>
            </span>
          </button>
          <div class="t-menu" id="t-menu" hidden>
            <a class="t-main-link" href="/deck">Main view</a>
            <!-- Full screen without the bar of the browser. Hidden where the browser cannot, or when the app already is. -->
            <button type="button" class="t-main-link t-full" id="t-full" aria-pressed="false" hidden>
              Fullscreen
            </button>
            <ul class="t-links" aria-label="Connection">
              <li class="link" id="t-link-bridge" data-state="unknown">
                <span class="lamp" aria-hidden="true"></span><span class="link-text">Bridge</span>
              </li>
              <li class="link" id="t-link-device" data-state="unknown">
                <span class="lamp" aria-hidden="true"></span><span class="link-text">LR512</span>
              </li>
              <li class="link" id="t-link-hass" data-state="unknown" hidden>
                <span class="lamp" aria-hidden="true"></span><span class="link-text">Home Assistant</span>
              </li>
            </ul>
          </div>
        </div>
        <div class="tempo">
          <div class="col" style="gap: 2px">
            <span class="bpm num" id="t-bpm"></span>
            <span class="src" id="t-src"></span>
          </div>
          <div class="beats" id="t-beats" aria-hidden="true"><i class="one"></i><i></i><i></i><i></i></div>
        </div>
        <button type="button" class="key c t-tap" id="t-tap">Tap</button>
        <div class="t-master" id="t-master"></div>
        <fieldset class="spd t-speed" id="t-speed" aria-label="Master speed"></fieldset>
        <button type="button" class="bo t-blackout" id="t-blackout" aria-pressed="false">
          Blackout
        </button>
      </header>

      <div class="t-body" id="t-body">
        <!-- The groups, each with what it shows right now. -->
        <nav class="t-rail" id="m-tabs" aria-label="Groups"></nav>

        <!-- The looks of the group, and under them what every lane does. -->
        <section class="t-main" id="t-main" aria-label="Looks">
          <div class="t-moodrow">
            <div class="tabs" id="m-moodbar" role="tablist" aria-label="Moods"></div>
            <span class="lbl" id="t-where"></span>
          </div>

          <!-- The lamps of the room: their dimmer and a switch per rail. Only on the tab of the room. -->
          <section class="t-room" id="t-room" aria-label="Room lights" hidden>
            <div class="t-room-dimmer" id="t-room-dimmer"></div>
            <fieldset class="t-rails" id="t-rails" aria-label="Rails" hidden></fieldset>
          </section>

          <div class="t-looks" id="m-looks">
            <p class="t-none" id="m-looks-none" hidden></p>
            <div class="t-grid" id="m-grid"></div>
          </div>

          <!-- What each lane of the group does right now. A lane the group has nothing for is left out. -->
          <div class="panel t-lanes" id="t-lanes">
            <div class="t-cell" id="t-cell-lights">
              <span class="lbl" data-name>Lights</span><span class="t-cell-val" data-value></span>
            </div>
            <div class="t-cell" id="t-cell-colour">
              <span class="lbl" data-name>Colour</span>
              <span class="t-cell-row"><span class="sws" data-swatches></span><span class="t-cell-val" data-value></span></span>
            </div>
            <div class="t-cell" id="t-cell-motion">
              <span class="lbl" data-name>Motion</span><span class="t-cell-val" data-value></span>
            </div>
            <div class="t-cell" id="t-cell-zone">
              <span class="lbl" data-name>Zone</span><span class="t-cell-val" data-value></span>
            </div>
          </div>
        </section>

        <!--
          The video wall (its tile is in the rail): what plays, the library of the player, the text of
          the track and where it goes. It takes the place of the looks and the tray. The page fills it
          (videowallPanel.js).
        -->
        <section class="t-wall" id="m-wall" aria-label="Video wall" hidden></section>

        <!-- What goes with the mood of the look that is on, to vary the look with: always there. -->
        <aside class="t-tray" id="m-tray" aria-labelledby="m-tray-title">
          <div class="sh t-tray-head">
            <div class="col" style="gap: 2px">
              <h3 id="m-tray-title">Vary</h3>
              <span class="t-tray-with" id="m-tray-hint"></span>
            </div>
            <div class="row" style="gap: 6px">
              <!-- All puts the look back as it was stored. -->
              <button type="button" class="key c t-small" id="m-all">All</button>
              <button type="button" class="key c t-small" id="m-off">Off</button>
            </div>
          </div>
          <section class="t-lane" data-lane="colour" id="m-lane-colour" aria-label="Colour">
            <div class="sh"><h3 id="m-name-colour">Colour</h3><span class="t3 t-note">dashed = the look's own</span></div>
            <div class="t-chips" id="m-keys-colour"></div>
          </section>
          <section class="t-lane" data-lane="lights" id="m-lane-lights" aria-label="Lights">
            <div class="sh"><h3 id="m-name-lights">Effect</h3></div>
            <div class="t-chips" id="m-keys-lights"></div>
          </section>
          <section class="t-lane" data-lane="motion" id="m-lane-motion" aria-label="Motion">
            <div class="sh"><h3 id="m-name-motion">Movement</h3></div>
            <div class="t-chips" id="m-keys-motion"></div>
          </section>
          <section class="t-lane" data-lane="zone" id="m-lane-zone" aria-label="Zone">
            <div class="sh"><h3 id="m-name-zone">Zone</h3></div>
            <div class="t-chips" id="m-keys-zone"></div>
          </section>
        </aside>
      </div>

      <!--
        The parts of the evening: a key per sequence of the show (Begin, Midden, Techno ...). A press
        starts it, and the looks change by themselves on the bars. Next skips to the next step, Hold
        stops the sequence and leaves the lights as they are.
      -->
      <section class="t-parts" id="m-phases" aria-label="Parts of the evening" hidden>
        <div class="t-part-keys" id="m-phase-keys"></div>
        <button type="button" class="key c t-step" id="m-next">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4l9 7-9 7z" /><path d="M17 4v14" /></svg>
          <span>Next</span>
        </button>
        <button type="button" class="key c t-step" id="m-hold">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4v14M15 4v14" /></svg>
          <span>Hold</span>
        </button>
      </section>

      <!-- Last, and over the foot of the screen: a notice takes no room, so no key moves when it comes. -->
      <div class="notices-stack" id="notices">
        <p class="notice" id="t-notice" data-level="alarm" role="alert" hidden></p>
      </div>
    </div>

    <script type="module" src="/tablet.js"></script>
  </body>
</html>
