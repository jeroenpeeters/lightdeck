<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Install · Lightdeck</title>
    <link rel="preload" href="/fonts/plex-condensed-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/plex.css" />
    <link rel="stylesheet" href="/lightdeck.css" />
    <link rel="stylesheet" href="/chrome.css" />
    <link rel="stylesheet" href="/install.css" />
  </head>
  <body>
    <!--
      No top bar here: this page has to work on a plain http address, where it only reads what the browser
      says. The key at the left goes back to the live page, as on every setup page.
    -->
    <div class="app page" id="app">
      <header class="page-head">
        <div class="ph-title">
          <a class="key c install-back" href="/tablet" id="install-back">Live</a>
          <h1>Install as an app</h1>
        </div>
        <div class="ph-actions">
          <button type="button" class="key c" id="install-key" hidden>Install Lightdeck</button>
        </div>
      </header>
      <div class="setup no-nav no-side">
        <main class="setup-main">
          <p class="hint">
            What this browser says about this page. Chrome only installs a page as an app, with no bar of
            the browser, when every line here is good. The Install key comes when Chrome offers it.
          </p>
          <ul class="checks" id="checks"></ul>
        </main>
      </div>
    </div>
    <script type="module" src="/install.js"></script>
  </body>
</html>
