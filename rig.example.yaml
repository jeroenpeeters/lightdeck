# The rig: what hangs in the room, as far as Home Assistant drives it. Copy this to rig.yaml
# where lightdeck is started (or give --rig / RIG_FILE), and put your own entities in it.
# Lightdeck also needs HASS_URL (or --hass), for example
#   ws://homeassistant.local:8123/api/websocket
# and HASS_TOKEN, a long-lived access token made on your profile page in Home Assistant, in its
# environment. Without this file there are no lamps and nothing asks Home Assistant.
#
# The room is one fixture. Every lamp is one entity, a light or a switch. A zone is a list of
# lights, like a bar of the spider: the scenery effects work on the zones. A light that is in
# no zone is one zone of its own after the others, and without zones all lights are one. A
# switch is in no zone, and `blackout: true` makes it go off in a blackout and with the master
# at 0 (without it a switch is left alone by both).
fixtures:
  - id: room
    kind: room
    label: Room Lights
    lamps:
      - { id: bar, label: Bar, entity: light.bar }
      - { id: shelf, label: Shelf, entity: light.shelf }
      - { id: ceiling, label: Ceiling, entity: light.living_room }
      - { id: fog, label: Fog machine, entity: switch.fog, blackout: true }
    zones:
      - { id: low, label: Low, lamps: [bar, shelf] }
      - { id: high, label: High, lamps: [ceiling] }

  # The decor: what is part of the set and not of the lighting. Two sorts: `switches` (here two UV lamps on
  # the symbols of a cabinet) and `strips` of WLED (here three, in dryer hoses). No scene, look or sequence
  # touches them: they are
  # on and off by hand on the tab Decor of the tablet page, apart or together. `blackout: true` is where
  # "follows the blackout of the console" starts; the tablet changes it while the show runs. The group
  # that gives the fixture its tab is in the show file:  groups: { decor: { label: Decor, fixtures: [decor] } }
  - id: decor
    kind: decor
    label: Decor
    switches:
      - { id: uv1, label: UV 1, entity: switch.uv_lamp_1, blackout: true }
      - { id: uv2, label: UV 2, entity: switch.uv_lamp_2, blackout: true }
    # A strip has its own colour (`colour: '#rrggbb'`, default white), a brightness and an effect of WLED's
    # own, which the strip lists. The speed of the effect follows the bpm through the `number` entity that WLED
    # makes, `number.wled_buis1_speed` unless `speed:` says otherwise. `blackout: true` is where "follows
    # the blackout of the console" starts for a strip.
    strips:
      - { id: buis1, label: Buis 1, entity: light.wled_buis1 }
      - { id: buis2, label: Buis 2, entity: light.wled_buis2, speed: number.wled_buis2_speed }
      - { id: buis3, label: Buis 3, entity: light.wled_buis3, colour: '#00e5ff' }
