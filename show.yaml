      scissors-fast:
        label: Scissors fast
        type: motion
        fixtures:
          spider:
            motion: { id: scissor, speed: 1 }
      # Zones: how far the motion effects reach. An effect's 0 is the min of a bar and its 100 the max,
      # so the swing happens inside the window. A bar turns the other way than its neighbour for the
      # same tilt, so each has its own window. The numbers are what Jeroen measured
      # (2026-10-21, percent of the tilt slider per bar; over heads was given as min 30 / max 27 and 23 / 26,
      # the first pair turned round because min must be below max).
      zone-floor:
        label: Floor
        type: zone
        fixtures:
          spider: { zone: { tilt: [ { min: 0, max: 0.2 }, { min: 0.4, max: 0.8 } ] } }
      zone-over-heads:
        label: Over heads
        type: zone
        fixtures:
          spider: { zone: { tilt: [ { min: 0.27, max: 0.3 }, { min: 0.23, max: 0.26 } ] } }
    # What goes together, for the tablet (/moods): a look is in one, and while it is on the tablet
