      beat:
        label: On the beat
        lights: [ pattern-chase, colour-chase, dots-26, mixed-18 ]
        motion: [ breathe, big-still, small-still ]
      moving:
        label: Moving
        lights: [ pattern-12, pattern-26, pattern-40, mixed-18, discobal, discobal-big, disco-sparkle ]
        motion: [ spin, spin-back, sweeping, twisting, discobal-aim, discobal-big-aim, disco-sparkle-aim ]
    looks:
