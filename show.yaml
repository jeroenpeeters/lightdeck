sequences:
  # Several sequences run at once, one per group (Jeroen, 2026-11-05): the spider, the room, the laser
  # and the strips each have their own. Starting a sequence stops only the ones that set a group it
  # sets too, so Begin, Midden and Techno of one group take each other's place while the others go on.
  # `category` is only for the pages: the sequences of a category are shown together.
  # The three parts of the evening of the spider (Jeroen, 2026-10-20): each loops over its looks on the
  # bars, so the spider needs no attention.
  begin:
    label: Begin
    category: Spider
    steps:
      - { bars: 32, looks: { spider: glow } }
      - { bars: 32, looks: { spider: breathe } }
      - { bars: 32, looks: { spider: doors-open } }
      - { bars: 32, looks: { spider: aurora } }
      - { bars: 32, looks: { spider: floor-glow } }
      - { bars: 32, looks: { spider: wandering } }
      - { bars: 32, looks: { spider: glow-dusk } }
      - { bars: 32, looks: { spider: slow-ember } }
      - { bars: 32, looks: { spider: doors-dusk } }
      - { bars: 32, looks: { spider: floor-drift } }
      - { bars: 32, looks: { spider: wandering-pumpkin } }
  midden:
    label: Midden
    category: Spider
    steps:
      - { bars: 24, looks: { spider: creeping-in } }
      - { bars: 24, looks: { spider: heartbeat } }
      - { bars: 24, looks: { spider: candles-low } }
      - { bars: 24, looks: { spider: bounce } }
      - { bars: 24, looks: { spider: pump } }
      - { bars: 24, looks: { spider: rolling } }
      - { bars: 24, looks: { spider: sparkle } }
      - { bars: 24, looks: { spider: alternate } }
      - { bars: 24, looks: { spider: heartbeat-red } }
      - { bars: 24, looks: { spider: bounce-witch } }
  techno:
    label: Techno
    category: Spider
    steps:
      - { bars: 16, looks: { spider: crossfire } }
      - { bars: 16, looks: { spider: scan } }
      - { bars: 16, looks: { spider: pairs } }
      - { bars: 16, looks: { spider: the-void } }
      - { bars: 8, looks: { spider: build-up } }
      - { bars: 16, looks: { spider: burst } }
      - { bars: 16, looks: { spider: haunted } }
      - { bars: 16, looks: { spider: cross-pulse } }
      - { bars: 16, looks: { spider: static } }
      - { bars: 8, looks: { spider: lightning } }
      - { bars: 16, looks: { spider: scan-red } }
  room-begin:
    label: Begin
    category: Room
    steps:
      # The lamps hold still: a look for about a minute at 126 bpm.
      - { bars: 64, looks: { room: welcome } }
      - { bars: 64, looks: { room: pumpkin-patch } }
      - { bars: 64, looks: { room: embers } }
  room-midden:
    label: Midden
    category: Room
    steps:
      - { bars: 48, looks: { room: brew } }
      - { bars: 48, looks: { room: dusk-rails } }
      - { bars: 48, looks: { room: party } }
  room-techno:
    label: Techno
    category: Room
    steps:
      - { bars: 32, looks: { room: blood-moon } }
      - { bars: 32, looks: { room: storm } }
      - { bars: 32, looks: { room: the-void } }
  # The laser alternates the two looks on the discobal, one bar each.
  discobal:
    label: Discobal wissel
    category: Laser
    steps:
      - { bars: 2, looks: { laser: discobal } }
      - { bars: 2, looks: { laser: discobal-big } }
  # The strips (pipes) go through their looks of rig.yaml.
  strips-begin:
    label: Begin
    category: Strips
    steps:
      - { bars: 16, looks: { decor: slow } }
      - { bars: 16, looks: { decor: brew } }
      - { bars: 16, looks: { decor: bubbling } }
  strips-midden:
    label: Midden
    category: Strips
    steps:
      - { bars: 16, looks: { decor: transmute } }
      - { bars: 16, looks: { decor: shadow } }
      - { bars: 16, looks: { decor: seal } }
  strips-techno:
    label: Techno
    category: Strips
    steps:
      - { bars: 8, looks: { decor: shot } }
      - { bars: 8, looks: { decor: storm } }
limits:
  spider:
    tilt:
      - { min: 0, max: 0.37 }
      - { min: 0.16, max: 0.8 }
