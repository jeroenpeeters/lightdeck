palettes:
  white:
    label: White
    colours: [ "#000000ff" ]
    mode: static
    change: step
    speed: 0.25
  rainbow:
    label: Rainbow
    colours: [ "#ff0000", "#ffaa00", "#00ff00", "#00ffff", "#0000ff", "#ff00ff" ]
    mode: cycle
    change: fade
    speed: 0.25
  halloween:
    label: Halloween
    colours: [ "#ce5927", "#f90101" ]
    mode: cycle
    change: step
    speed: 1
  pumpkin:
    label: Pumpkin
    colours: [ "#ff5a00", "#6a00ff" ]
    mode: static
    change: step
    speed: 0.25
  witch:
    label: Witch
    colours: [ "#39ff14", "#8a00ff" ]
    mode: static
    change: step
    speed: 0.25
  ember:
    label: Ember
    colours: [ "#ff3c00", off ]
    mode: static
    change: step
    speed: 0.25
  bloodmoon:
    label: Blood moon
    colours: [ "#ff0000", "#6a00ff" ]
    mode: static
    change: step
    speed: 0.25
  void:
    label: Void
    colours: [ "#ff0000", off ]
    mode: static
    change: step
    speed: 0.25
  lightning:
    label: Lightning
    colours: [ "#d8e0ff", "#6a00ff" ]
    mode: static
    change: step
    speed: 0.25
  dusk:
    label: Dusk
    colours: [ "#ff5a00", "#8a00ff", "#ff2a6d" ]
    mode: static
    change: step
    speed: 0.25
  # For the pipes above all: 1 the water itself, 2 the deep dark water behind it, 3 the light on the crests.
  water:
    label: Water
    colours: [ "#1f6bff", "#02104a", "#7fd3ff" ]
    mode: static
    change: step
    speed: 0.25
  sunset-drift:
    label: Sunset drift
    colours: [ "#ff5a00", "#ff2a6d", "#8a00ff" ]
    mode: cycle
    change: fade
    speed: 0.25
  mid-shift:
    label: Mid shift
    # Two colours of the theme that move on by one every bar: the pool is four colours, two show.
    colours: [ "#ff5a00", "#8a00ff", "#ff2a6d", "#39ff14" ]
    mode: cycle
    change: step
    speed: 0.25
    visible: 2
  techno-pulse:
    label: Techno pulse
    # One colour, and nothing behind it, that changes on every beat through the colours of the theme.
    colours: [ "#ff0000", "#8a00ff", "#39ff14", "#ff5a00", "#d8e0ff" ]
    mode: cycle
    change: step
    speed: 1
    visible: 1
  techno-bar:
    label: Techno bar
    # The same, one colour for a bar.
    colours: [ "#ff0000", "#8a00ff", "#39ff14", "#ff5a00", "#d8e0ff" ]
    mode: cycle
    change: step
    speed: 0.25
    visible: 1
