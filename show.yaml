  laser:
    label: Laser
    fixtures: [ laser ]
    # The patterns are numbered because nobody has looked at them yet (docs/laser-simulator-plan.md):
    # a first guess, to be renamed once the survey has photographed them. Mode 95 is manual, the
    # program byte is the pattern and the colour byte one of the single colours.
    scenes:
      pattern-12:
        label: Pattern 12
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 57, colour: 22 }
      pattern-26:
        label: Pattern 26
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 127, colour: 4 }
      pattern-40:
        label: Pattern 40
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 197, colour: 49 }
      mixed-18:
        label: Mixed 18
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 87, colour: 100 }
      dots-26:
        label: Dots 26
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 127, colour: 40, drawing: 200 }
      changing-22:
        label: Changing 22
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 107, colour: 200 }
      pattern-chase:
        label: Pattern chase
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 12, colour: 22 }
            effect: { id: patterns, speed: 0.5 }
      colour-chase:
        label: Colour chase
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 127 }
            effect: { id: colours, speed: 1 }
            colours: [ 4, 22, 40 ]
      big-still:
        label: Big, still
        type: motion
        fixtures:
          laser:
            raw: { size: 10, moveV: 117 }
      small-still:
        label: Small, still
        type: motion
        fixtures:
          laser:
            raw: { size: 40, moveV: 117 }
      breathe:
        label: Breathe
        type: motion
        fixtures:
          laser:
            raw: { moveV: 117 }
            motion: { id: pulse, speed: 0.5 }
      sweeping:
        label: Sweep
        type: motion
        fixtures:
          laser:
            raw: { size: 20 }
            motion: { id: sweep, speed: 0.5 }
      twisting:
        label: Twist
        type: motion
        fixtures:
          laser:
            raw: { size: 20, moveV: 117 }
            motion: { id: twist, speed: 0.5 }
      spin:
        label: Spin
        type: motion
        fixtures:
          laser:
            raw: { size: 20, rotation: 140, moveV: 117 }
      spin-back:
        label: Spin back
        type: motion
        fixtures:
          laser:
            raw: { size: 20, rotation: 210, moveV: 117 }
      # Laser op Discobal (Jeroen, 2026-11-04): pattern 2 small and turning slowly, aimed low in the
      # corner of the field, set by hand on the real laser and read back from what was sent.
      discobal:
        label: Discobal
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 7, colour: 22 }
      discobal-aim:
        label: Discobal aim
        type: motion
        fixtures:
          laser:
            raw: { rotation: 180, moveH: 61, moveV: 1, size: 61 }
      # Laser op grote Discobal (Jeroen, 2026-11-04): the second one, for the big ball. Pattern 1,
      # turning a little slower, aimed higher and further across; read back from what was sent.
      discobal-big:
        label: Big discobal
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 82, colour: 22 }
      discobal-big-aim:
        label: Big discobal aim
        type: motion
        fixtures:
          laser:
            raw: { rotation: 178, moveH: 94, moveV: 66, size: 58 }
      disco-sparkle:
        label: Disco sparkle
        type: lights
        fixtures:
          laser:
            raw: { mode: 95, program: 127, colour: 22 }
      disco-sparkle-aim:
        label: Disco sparkle aim
        type: motion
        fixtures:
          laser:
            raw: { rotation: 180, moveH: 61, moveV: 1, size: 61 }
