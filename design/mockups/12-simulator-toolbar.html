<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Simulator</title>
<link rel="stylesheet" href="../tokens/lightdeck.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090B}
.tb{display:flex;flex-direction:column;gap:4px;padding:8px;background:rgba(15,17,20,.92);border:1px solid #2A2F37;border-radius:6px}
.tb .lbl{padding:2px 4px 4px}
.tb .key{min-height:44px;height:48px;padding:0 12px;justify-content:center}
.sel{background:#1E2228;border-color:#F1F3F5;box-shadow:inset 0 0 0 1px #F1F3F5}
.nf{display:flex;flex-direction:column;gap:4px}
.nf .field{width:96px;justify-content:flex-end}
</style>
</head>
<body>
<div class="app" style="width: 1280px; height: 800px; display: grid; grid-template-rows: 64px 1fr">

  <div class="top">
    <button class="menu" style="gap: 8px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
      <span>Live</span><span class="dots"><i></i><i></i><i class="sim"></i></span>
    </button>
    <div class="tempo">
      <div class="col" style="gap: 2px"><span class="bpm num">126</span><span class="src">By hand</span></div>
      <div class="beats"><i class="one"></i><i class="lit"></i><i></i><i></i></div>
    </div>
    <button class="key c" style="width: 96px; height: 48px">Tap</button>
    <div class="fader" style="flex: 1; max-width: 340px"><div class="fill" style="width: 100%"></div><span class="fl">Master</span><span class="fv">100</span><div class="hand" style="left: calc(100% - 8px)"></div></div>
    <div class="spd"><button>÷4</button><button>÷2</button><button class="is-on">×1</button><button>×2</button><button>×4</button></div>
    <div style="flex: 1"></div>
    <button class="bo" style="width: 168px">Blackout</button>
  </div>

  <div style="position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #14171c 0%, #08090B 70%)">
    <!-- 3D view placeholder -->
    <div style="position: absolute; left: -10%; right: -10%; bottom: -10%; height: 62%; background-image: linear-gradient(#1f242b 1px, transparent 1px), linear-gradient(90deg, #1f242b 1px, transparent 1px); background-size: 64px 64px; transform: perspective(500px) rotateX(58deg); transform-origin: bottom"></div>
    <div style="position: absolute; left: 50%; top: 150px; width: 520px; height: 14px; margin-left: -260px; background: #2a3038; border-radius: 3px"></div>
    <div style="position: absolute; left: calc(50% + 60px); top: 160px; width: 90px; height: 50px; border: 2px solid #F1F3F5; border-radius: 3px"></div>
    <div style="position: absolute; left: calc(50% + 80px); top: 210px; width: 50px; height: 260px; background: linear-gradient(rgba(255,102,0,.35), transparent); filter: blur(6px)"></div>
    <span class="lbl" style="position: absolute; left: calc(50% + 60px); top: 132px; color: #F1F3F5">Spider · picked</span>

    <!-- left: fixture + tool -->
    <div class="tb" style="position: absolute; left: 12px; top: 12px; width: 156px">
      <span class="lbl">Fixture</span>
      <button class="key sel">Spider</button>
      <button class="key">Rail 1</button>
      <button class="key">Rail 2</button>
      <button class="key">Rail 3</button>
      <span class="lbl" style="padding-top: 10px">Tool</span>
      <button class="key sel">Move</button>
      <button class="key">Rotate</button>
      <button class="key">World axes</button>
      <button class="key">Snap</button>
    </div>

    <!-- right: aim + view -->
    <div class="tb" style="position: absolute; right: 12px; top: 12px; width: 172px">
      <span class="lbl">Lights aim</span>
      <button class="key sel">Down</button>
      <button class="key">Forward</button>
      <button class="key">Up</button>
      <button class="key">Back</button>
      <span class="lbl" style="padding-top: 10px">View</span>
      <button class="key sel">Room</button>
      <button class="key">Photo view</button>
      <button class="key">Dark</button>
      <button class="key is-on" style="margin-top: 6px">Smoke machine</button>
    </div>

    <!-- bottom: fixture position + room -->
    <div class="tb" style="position: absolute; left: 180px; right: 12px; bottom: 12px; flex-direction: row; align-items: flex-end; gap: 14px; padding: 10px 12px">
      <div class="nf"><span class="lbl">Across m</span><div class="field">0.00</div></div>
      <div class="nf"><span class="lbl">Up m</span><div class="field">2.40</div></div>
      <div class="nf"><span class="lbl">Along m</span><div class="field">0.00</div></div>
      <div style="width: 1px; align-self: stretch; background: #2A2F37"></div>
      <div class="nf" style="flex: 1"><span class="lbl">Haze</span><div class="fader"><div class="fill" style="width: 60%"></div><span class="fv">60</span><div class="hand" style="left: 60%"></div></div></div>
      <div class="nf" style="flex: 1"><span class="lbl">Room light</span><div class="fader"><div class="fill" style="width: 60%"></div><span class="fv">60</span><div class="hand" style="left: 60%"></div></div></div>
      <div class="nf"><span class="lbl">Ceiling m</span><div class="field" style="width: 72px">2.6</div></div>
      <div style="width: 1px; align-self: stretch; background: #2A2F37"></div>
      <button class="key" style="height: 48px; min-height: 48px; justify-content: center">Calibrate</button>
      <button class="key" style="height: 48px; min-height: 48px; justify-content: center">Reset fixture</button>
      <button class="key" style="height: 48px; min-height: 48px; justify-content: center">Reset view</button>
    </div>
  </div>
</div>
</body>
</html>
