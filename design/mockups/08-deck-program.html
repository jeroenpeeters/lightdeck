<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Deck · Program</title>
<link rel="stylesheet" href="../tokens/lightdeck.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#08090B} .dk{min-height:72px;padding:9px 10px} .dk .nm{font:600 16px/1.1 var(--f-ui)}</style>
</head>
<body>
<div class="app" style="width: 1280px; height: 800px; display: grid; grid-template-rows: 64px 6px 64px 1fr; box-shadow: inset 0 0 0 2px #5AA8FF">

  <div class="top">
    <button class="menu" style="gap: 8px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
      <span>Live</span><span class="dots"><i></i><i></i><i class="sim"></i></span>
    </button>
    <div class="tempo">
      <div class="col" style="gap: 2px"><span class="bpm num">126</span><span class="src">By hand</span></div>
      <div class="beats"><i class="one"></i><i class="lit"></i><i></i><i></i></div>
    </div>
    <button class="key c" style="width: 96px; height: 48px">Tap</button>
    <div class="fader" style="flex: 1; max-width: 340px"><div class="fill" style="width: 100%"></div><span class="fl">Master</span><span class="fv">100</span><div class="hand" style="left: calc(100% - 8px)"></div></div>
    <div class="spd"><button>÷4</button><button>÷2</button><button class="is-on">×1</button><button>×2</button><button>×4</button></div>
    <div style="flex: 1"></div>
    <button class="bo" style="width: 168px">Blackout</button>
  </div>
  <div class="prog" aria-hidden="true"></div>

  <div class="row" style="justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2A2F37">
    <div class="row" style="gap: 14px"><h1 style="margin: 0; font: 700 28px var(--f-ui)">Deck</h1><span class="tag edit">Program</span><span class="t2" style="font-size: 15px">A press picks a key. Nothing changes on the rig until you store.</span></div>
    <div class="tabs" style="padding: 4px; background: #0F1114; border: 1px solid #2A2F37; border-radius: 6px">
      <button class="tab" style="width: 120px">Show</button>
      <button class="tab is-sel" style="width: 120px; box-shadow: inset 0 -3px 0 #5AA8FF; color: #5AA8FF">Program</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 200px 1fr 340px; min-height: 0">
    <nav class="snav" style="padding: 12px; border-right: 1px solid #2A2F37">
      <span class="lbl" style="padding: 4px 4px 6px">Groups</span>
      <button class="is-sel">Spider<span class="num t3" style="font-size: 13px">24</span></button>
      <button>Laser<span class="num t3" style="font-size: 13px">9</span></button>
      <button>Room<span class="num t3" style="font-size: 13px">12</span></button>
      <button>All<span class="num t3" style="font-size: 13px">6</span></button>
      <span class="lbl" style="padding: 16px 4px 6px">Lane</span>
      <button class="is-sel" style="height: 48px">Looks</button>
      <button style="height: 48px">Lights</button>
      <button style="height: 48px">Colour</button>
      <button style="height: 48px">Motion</button>
      <button style="height: 48px">Zone</button>
      <span class="lbl" style="padding: 16px 4px 6px">Moods</span>
      <button style="height: 48px">Edit moods</button>
    </nav>

    <main style="display: flex; flex-direction: column; gap: 10px; padding: 12px; min-width: 0">
      <div class="row" style="justify-content: space-between">
        <span class="lbl">Spider · looks · page 2 of 2</span>
        <div class="row" style="gap: 6px"><button class="key c" style="width: 56px" aria-label="Previous page">‹</button><button class="key c" style="width: 56px" aria-label="Next page">›</button></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <button class="key dk"><span class="nm">Wandering pumpkin</span><div class="strip"><span style="background: #FF6600"></span><span style="background: #7A00FF"></span></div></button>
        <button class="key dk is-edit"><div class="hd"><span class="nm">4 Creeping in</span><span class="tag edit">Picked</span></div><div class="strip"><span style="background: #3CFF1E"></span><span style="background: #8A00FF"></span></div></button>
        <button class="key dk"><span class="nm">Heartbeat</span><div class="strip"><span style="background: #FF6600"></span><span style="background: #8A00FF"></span><span style="background: #FF2D6F"></span><span style="background: #3CFF1E"></span></div></button>
        <button class="key dk"><span class="nm">Bounce</span><div class="strip"><span style="background: #FF6600"></span><span style="background: #8A00FF"></span><span style="background: #FF2D6F"></span><span style="background: #3CFF1E"></span></div></button>
        <button class="key dk"><span class="nm">Pump</span><div class="strip"><span style="background: #CC5A2C"></span><span style="background: #FF0000"></span></div></button>
        <button class="key dk"><span class="nm">Sparkle</span><div class="strip"><span style="background: #3CFF1E"></span><span style="background: #8A00FF"></span></div></button>
        <button class="key dk"><span class="nm">Rolling</span><div class="strip"><span style="background: #CC5A2C"></span><span style="background: #FF0000"></span></div></button>
        <button class="key dk"><span class="nm">Alternate</span><div class="strip"><span style="background: #FF6600"></span><span style="background: #8A00FF"></span><span style="background: #FF2D6F"></span><span style="background: #3CFF1E"></span></div></button>
        <button class="key dk"><span class="nm">Heartbeat red</span><div class="strip"><span style="background: #FF0000"></span><span style="background: #7A00FF"></span></div></button>
        <button class="key dk"><span class="nm">Bounce witch</span><div class="strip"><span style="background: #3CFF1E"></span><span style="background: #8A00FF"></span></div></button>
        <button class="key dk empty" style="color: #5AA8FF; border-color: #2f5480">+ Store here</button>
        <button class="key dk empty">Empty</button>
        <button class="key dk empty">Empty</button>
        <button class="key dk empty">Empty</button>
        <button class="key dk empty">Empty</button>
      </div>
    </main>

    <aside style="display: flex; flex-direction: column; gap: 14px; padding: 12px; background: #0F1114; border-left: 1px solid #2A2F37">
      <div class="sh"><h3>Store what is on now</h3></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <button class="key c">Lights</button>
        <button class="key c">Motion</button>
        <button class="key c">Zone</button>
        <button class="key c is-edit">Look</button>
      </div>
      <div class="panel col" style="gap: 8px; padding: 12px; background: #08090B">
        <span class="lbl">A look keeps</span>
        <div class="row" style="justify-content: space-between; font-size: 15px"><span class="t2">Lights</span><span>Creeping in</span></div>
        <div class="row" style="justify-content: space-between; font-size: 15px"><span class="t2">Colour</span><span class="row" style="gap: 8px"><span class="sws"><i class="sw" style="background: #FF0000"></i><i class="sw" style="background: #7A00FF"></i></span>Blood moon</span></div>
        <div class="row" style="justify-content: space-between; font-size: 15px"><span class="t2">Motion</span><span>Stalking</span></div>
        <div class="row" style="justify-content: space-between; font-size: 15px"><span class="t2">Zone</span><span>None</span></div>
        <div class="row" style="justify-content: space-between; font-size: 15px"><span class="t2">Mood</span><span>Midden</span></div>
      </div>
      <div class="col" style="gap: 6px">
        <span class="lbl">Name</span>
        <div class="field">Creeping in red</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
        <button class="key c" style="background: #0D1A29; border-color: #5AA8FF; color: #5AA8FF">Store as new</button>
        <button class="key c" style="background: #0D1A29; border-color: #5AA8FF; color: #5AA8FF">Replace picked</button>
      </div>
      <div class="sh" style="margin-top: 6px"><h3>Picked: 4 Creeping in</h3></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
        <button class="key c">Rename</button>
        <button class="key c" style="border-color: #FF4B4B; color: #FF4B4B">Delete…</button>
      </div>
    </aside>
  </div>
</div>
</body>
</html>
